name: Desktop installers

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/desktop-installers.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows MSI/NSIS
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript workspace
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build Windows installers
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles msi,nsis
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentdeck-desktop-windows
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe

  macos:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-13
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install JavaScript workspace
        run: npm ci
      - name: Build packages
        run: npm run build
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci
      - name: Build macOS installer
        working-directory: apps/desktop
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri -- build --bundles dmg
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: agentdeck-desktop-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
